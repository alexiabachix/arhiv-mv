<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Архів робіт М.В.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=PT+Serif:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#f1f2ee;--paper:#fff;--ink:#1c2631;--muted:#5d6874;--blue:#274a7a;--gold:#c8962b;--line:#d6d9d3;
--head:'Playfair Display',Georgia,serif;--body:'PT Serif',Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#14191f;--paper:#1c232b;--ink:#e8eae6;--muted:#9aa5b0;--blue:#7ea4d8;--line:#2d3742}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
aside{background:var(--ink);color:#eef0ec;padding:28px 0;position:sticky;top:0;height:100vh;overflow:auto}
@media(prefers-color-scheme:dark){aside{background:#0e1216}}
.brand{font:700 26px/1.2 var(--head);padding:0 28px 24px;border-bottom:3px solid var(--gold);margin:0 28px 12px;padding-left:0}
.brand small{display:block;font:400 14px var(--body);opacity:.7;margin-top:6px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font:inherit;padding:11px 28px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.07)}
nav button[aria-current=page]{border-left-color:var(--gold);background:rgba(255,255,255,.1);font-weight:700}
.main{min-width:0}
header{display:flex;align-items:center;gap:12px;padding:14px 32px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:18px;cursor:pointer}
.spacer{flex:1}
.searchbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:2px 4px 2px 16px;width:min(420px,100%)}
.searchbox input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);padding:8px 0;outline:none}
.searchbox button{border:0;background:var(--blue);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.searchbox:focus-within{border-color:var(--blue)}
section{padding:40px 32px 64px;max-width:1100px}
h1,h2{font-family:var(--head);line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(32px,5vw,52px)}
h2{font-size:28px}
p{max-width:68ch}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:40px;align-items:start}
.portrait{aspect-ratio:3/4;background:linear-gradient(160deg,#274a7a,#c8962b);border-radius:4px;display:grid;place-items:center;color:#fff;text-align:center;padding:16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;margin-top:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.card:hover{border-color:var(--blue)}
.thumb{aspect-ratio:4/3;background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:13px}
.card div.t{padding:10px 14px 14px}
.card b{display:block;font-family:var(--head);font-size:18px;line-height:1.3}
.card span{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:24px 0}
/* timeline */
.tl{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:56px 28px 24px;margin:20px 0 8px}
.tlwrap{position:relative}
.yearbubble{position:absolute;top:-44px;transform:translateX(-50%);background:var(--ink);color:#fff;font:700 18px var(--head);padding:2px 12px;border-radius:4px;pointer-events:none}
@media(prefers-color-scheme:dark){.yearbubble{background:var(--gold);color:#14191f}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:none;margin:0;cursor:grab}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--gold);border:4px solid var(--paper);box-shadow:0 0 0 2px var(--ink);margin-top:-12px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gold);border:4px solid var(--paper);box-shadow:0 0 0 2px var(--ink)}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:4px}
dialog{border:0;border-radius:6px;padding:0;max-width:min(760px,94vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.7)}
dialog .thumb{aspect-ratio:16/10}
dialog .body{padding:20px 26px 26px}
dialog dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0;color:var(--muted);font-size:15px}
dialog dd{margin:0;color:var(--ink)}
.close{float:right;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 12px;cursor:pointer;font:inherit}
@media(max-width:820px){
 .app{display:block}
 aside{position:fixed;inset:0 25% 0 0;z-index:20;height:auto;transform:translateX(-105%);transition:transform .2s}
 aside.open{transform:none}
 .burger{display:block}
 header{padding:12px 16px}
 section{padding:28px 18px 56px}
 .hero{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="side" aria-label="Розділи">
 <div class="brand" style="margin-left:28px">Архів робіт<br>М.В.<small>Український художник</small></div>
 <nav id="nav"></nav>
</aside>
<div class="main">
 <header>
  <button class="burger" id="burger" aria-label="Меню">☰</button>
  <div class="spacer"></div>
  <form class="searchbox" id="sform" role="search">
   <input id="q" type="search" placeholder="Пошук за назвою, роком, темою" aria-label="Пошук">
   <button type="submit" aria-label="Шукати"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
  </form>
 </header>
 <main id="view"></main>
</div>
</div>
<dialog id="dlg"></dialog>

<script>
/* ===== ДАНІ: замініть прикладами своїх робіт. img — шлях до фото, наприклад "photos/001.jpg" ===== */
const SITE_NAME="М.В.";
const WORKS=[
 {id:1,title:"Приклад: Морський пейзаж",year:1962,tech:"Олія, полотно",size:"60×80 см",tags:"пейзаж, море",desc:"Короткий опис картини та історія її створення.",img:"",place:"Родина",c:"#274a7a"},
 {id:2,title:"Приклад: Портрет жінки",year:1971,tech:"Олія, картон",size:"50×40 см",tags:"портрет",desc:"Опис.",img:"",place:"Приватна колекція",c:"#8a4b3a"},
 {id:3,title:"Приклад: Одеський дворик",year:1978,tech:"Акварель",size:"35×50 см",tags:"місто, Одеса",desc:"Опис.",img:"",place:"Родина",c:"#c8962b"},
 {id:4,title:"Приклад: Натюрморт із соняхами",year:1985,tech:"Олія, полотно",size:"70×90 см",tags:"натюрморт",desc:"Опис.",img:"",place:"Музей",c:"#6b7f3a"},
 {id:5,title:"Приклад: Степ восени",year:1993,tech:"Темпера",size:"45×65 см",tags:"пейзаж, степ",desc:"Опис.",img:"",place:"Родина",c:"#a2692b"},
 {id:6,title:"Приклад: Автопортрет",year:2004,tech:"Олія, полотно",size:"80×60 см",tags:"портрет",desc:"Опис.",img:"",place:"Родина",c:"#3d4a5c"}
];
const PHOTOS=[]; /* {src:"photos/a.jpg", caption:"…", year:1980} */
const EXHIBITIONS=[
 {year:1980,text:"Приклад: персональна виставка, Одеса. Замініть на справжні виставки."},
 {year:1995,text:"Приклад: групова виставка, Київ."}
];
const BIO="<p>Тут буде життєпис. Замініть цей текст власним: дата й місце народження, навчання, ключові етапи творчості, нагороди.</p>";

const PAGES=[["home","Головна"],["bio","Життєпис "+SITE_NAME],["works","Роботи в картинках"],["exh","Виставки"],["photos","Світлини "+SITE_NAME],["time","Хронологія"]];
const $=s=>document.querySelector(s), view=$('#view'), nav=$('#nav');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thumb=w=>`<div class="thumb" style="background-color:${w.c};${w.img?`background-image:url('${esc(w.img)}')`:''}">${w.img?'':'фото'}</div>`;
const card=w=>`<button class="card" data-id="${w.id}">${thumb(w)}<div class="t"><b>${esc(w.title)}</b><span>${w.year}, ${esc(w.tech)}</span></div></button>`;
const grid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p class="empty">Нічого не знайдено.</p>`;

function render(page,extra){
 nav.querySelectorAll('button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.p===page)||(b.dataset.p===page&&b.setAttribute('aria-current','page')));
 nav.querySelectorAll('button').forEach(b=>{if(b.dataset.p===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('#side').classList.remove('open');
 let h='';
 if(page==='home')h=`<section><div class="hero"><div><h1>Архів робіт ${SITE_NAME}</h1><p>Картини, світлини, виставки та хронологія творчості. Знайти роботу можна за назвою через пошук угорі.</p><p>Обирайте розділ у меню ліворуч.</p></div><div class="portrait">Тут буде портрет художника</div></div><h2 style="margin-top:48px">Нещодавно додані</h2>${grid(WORKS.slice(-4).reverse())}</section>`;
 if(page==='bio')h=`<section><h1>Життєпис</h1>${BIO}</section>`;
 if(page==='works')h=`<section><h1>Роботи в картинках</h1><p>${WORKS.length} робіт в архіві.</p>${grid(WORKS)}</section>`;
 if(page==='exh')h=`<section><h1>Виставки</h1>${EXHIBITIONS.map(e=>`<p><b>${e.year}</b> — ${esc(e.text)}</p>`).join('')}</section>`;
 if(page==='photos')h=`<section><h1>Світлини ${SITE_NAME}</h1>${PHOTOS.length?`<div class="grid">${PHOTOS.map(p=>`<figure style="margin:0"><img src="${esc(p.src)}" alt="${esc(p.caption)}" style="width:100%;border-radius:4px"><figcaption>${esc(p.caption)}</figcaption></figure>`).join('')}</div>`:'<p class="empty">Фото з’являться тут. Додайте їх у список PHOTOS у коді сторінки.</p>'}</section>`;
 if(page==='search'){const q=extra.toLowerCase().trim();const r=WORKS.filter(w=>(w.title+' '+w.year+' '+w.tags+' '+w.tech).toLowerCase().includes(q));h=`<section><h1>Пошук</h1><p>За запитом «${esc(extra)}»: ${r.length}</p>${grid(r)}</section>`}
 if(page==='time'){
  const ys=WORKS.map(w=>w.year),min=Math.min(...ys),max=Math.max(...ys);
  h=`<section><h1>Хронологія</h1><p>Перетягніть кружечок, щоб побачити роботи до обраного року.</p>
  <div class="tl"><div class="tlwrap"><div class="yearbubble" id="yb"></div><input type="range" id="rng" min="${min}" max="${max}" value="${min}" aria-label="Рік"></div>
  <div class="ticks"><span>${min}</span><span>${Math.round((min+max)/2)}</span><span>${max}</span></div></div>
  <h2 id="th"></h2><div id="tg"></div></section>`;
  view.innerHTML=h;
  const rng=$('#rng');
  const upd=()=>{const v=+rng.value,p=(v-min)/Math.max(1,max-min);
   const yb=$('#yb');yb.textContent=v;yb.style.left=`calc(${p*100}% + ${14-28*p}px)`;
   const l=WORKS.filter(w=>w.year<=v).sort((a,b)=>b.year-a.year);
   $('#th').textContent=`Роботи до ${v} року: ${l.length}`;$('#tg').innerHTML=grid(l)};
  rng.addEventListener('input',upd);upd();return;
 }
 view.innerHTML=h;
}
nav.innerHTML=PAGES.map(p=>`<button data-p="${p[0]}">${p[1]}</button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b){location.hash=b.dataset.p;render(b.dataset.p)}});
$('#burger').onclick=()=>$('#side').classList.toggle('open');
$('#sform').onsubmit=e=>{e.preventDefault();const q=$('#q').value;if(q.trim())render('search',q)};
view.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const w=WORKS.find(x=>x.id==c.dataset.id);
 $('#dlg').innerHTML=`${thumb(w)}<div class="body"><button class="close" onclick="dlg.close()">Закрити</button><h2>${esc(w.title)}</h2><dl><dt>Рік</dt><dd>${w.year}</dd><dt>Техніка</dt><dd>${esc(w.tech)}</dd><dt>Розмір</dt><dd>${esc(w.size)}</dd><dt>Де зберігається</dt><dd>${esc(w.place)}</dd></dl><p>${esc(w.desc)}</p></div>`;$('#dlg').showModal()});
render(PAGES.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'home');
</script>
</body>
</html>
